apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-dcgm-exporter
  labels:
    app.kubernetes.io/name: dcgm-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dcgm-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcgm-exporter
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: dcgm-exporter
          image: "{{ .Values.dcgmExporter.image.repository }}:{{ .Values.dcgmExporter.image.tag }}"
          imagePullPolicy: {{ .Values.dcgmExporter.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.dcgmExporter.service.port }}
          resources:
            {{- toYaml .Values.dcgmExporter.resources | nindent 12 }}
          securityContext:
            privileged: true
