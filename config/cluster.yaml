cloud:
  cloud_provider: generic_kubernetes
  cost_limit_usd_per_hour: 15.0
  enabled: true
  max_cloud_gpus: 4
cluster_name: powerx-mesh
paused: false
discovery:
  beacon_interval_sec: 3.0
  bind_address: 0.0.0.0
  broadcast_port: 58921
  peer_timeout_sec: 12.0
  static_peers:
  - cloud-head.internal:58921
idle:
  check_interval_sec: 2.0
  idle_threshold_sec: 60.0
  max_cpu_pct: 40.0
  max_gpu_pct: 20.0
  preemption_latency_sec: 0.5
  require_ac_power: true
node_id: node-01-primary-workstation
node_role: head
telemetry:
  api_port: 9401
  enable_dcgm_emulation: true
  prometheus_port: 9400
  scrape_interval_sec: 2.0
